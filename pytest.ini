; Collection is scoped to tests/ on purpose.
;
; This assistant creates real projects, and `projects/` is where they land -- in
; the repository, so a person can open one. A created project is a *working*
; Python project, which means it contains its own `conftest.py` inserting its own
; root at the front of `sys.path` and its own `tests/test_main.py`. Left to
; collect the whole tree, pytest picks both up: `import main` in this repo's tests
; then resolves to the created project's `main.py`, and twelve unrelated tests
; fail with `module 'main' has no attribute 'cmd_voice_test'`. The suite would
; break every time the assistant did its job.
;
; `norecursedirs` covers the same ground for anyone who runs pytest against an
; explicit path instead, and keeps collection off `benchmark/results`, which holds
; thousands of generated artifacts.
[pytest]
testpaths = tests
norecursedirs = .venv .git .pytest_cache .sandbox projects ws benchmark/results __pycache__
